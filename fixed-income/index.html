			padding: 0.45rem 0.8rem;
			text-decoration: none;

		.back-link:hover {

	<script>
		/* ── Animated pixel background (same technique as portfolio portrait) ── */
		(function () {
			"use strict";

			var canvas = document.getElementById("pixel-bg");
			if (!canvas) return;

			var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
			var ctx = canvas.getContext("2d");

			// NYU violet ramp — dark to light (same as main portfolio)
			var RAMP = [
				"#0d0a10", "#120c18", "#1a1124", "#261735",
				"#341e49", "#43265e", "#532e74", "#622f8c",
				"#753ba3", "#894eb6", "#9e66c9", "#b481da"
			];
			var CELL = 5;

			var cols = 0, rows = 0, running = false, rafId = 0;

			// 4x4 Bayer matrix for ordered dither
			var BAYER = [
				0, 8, 2, 10,
				12, 4, 14, 6,
				3, 11, 1, 9,
				15, 7, 13, 5
			];

			function resize() {
				var w = window.innerWidth;
				var h = window.innerHeight;
				var dpr = Math.min(window.devicePixelRatio || 1, 2);
				canvas.width = Math.round(w * dpr);
				canvas.height = Math.round(h * dpr);
				canvas.style.width = w + "px";
				canvas.style.height = h + "px";
				ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
				cols = Math.ceil(w / CELL);
				rows = Math.ceil(h / CELL);
			}

			function paint(t) {
				var n = RAMP.length;
				for (var y = 0; y < rows; y++) {
					for (var x = 0; x < cols; x++) {
						// Abstract luminance pattern: overlapping sine waves creating
						// a flowing, organic landscape
						var v =
							Math.sin(x * 0.06 + t * 0.00015) * 40 +
							Math.sin(y * 0.08 - t * 0.00012) * 35 +
							Math.sin((x + y) * 0.04 + t * 0.0001) * 30 +
							Math.sin(x * 0.12 - y * 0.09 + t * 0.00018) * 20 +
							80; // base brightness offset

						var dither = (BAYER[(y % 4) * 4 + (x % 4)] / 16 - 0.5) * 22;
						var idx = Math.floor(((v + dither) / 255) * n);
						if (idx < 0) idx = 0;
						if (idx >= n) idx = n - 1;
						ctx.fillStyle = RAMP[idx];
						ctx.fillRect(x * CELL, y * CELL, CELL - 1, CELL - 1);
					}
				}
			}

			function loop(t) {
				paint(t);
				rafId = requestAnimationFrame(loop);
			}

			function start() {
				if (running || reduceMotion) return;
				running = true;
				rafId = requestAnimationFrame(loop);
			}

			function stop() {
				running = false;
				cancelAnimationFrame(rafId);
			}

			resize();
			paint(0);
			if (!reduceMotion) start();

			var resizeTimer;
			window.addEventListener("resize", function () {
				clearTimeout(resizeTimer);
				resizeTimer = setTimeout(function () {
					resize();
					paint(performance.now());
				}, 150);
			});

			// pause when page not visible
			document.addEventListener("visibilitychange", function () {
				document.hidden ? stop() : start();
			});
		})();
	</script>
